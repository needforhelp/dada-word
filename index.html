var postscriptData={"postscript":{"sections":[{"title":"后记其一","paragraphs":["**原因**\n>总的来说，依旧是一时兴起的产物，跟日推本身差不多。\n\n因为真的发了很多莫名其妙的日推，也知道肯定没人听（毕竟自己也不听别人的朋友圈推歌）。\n灵光一闪便想着废物利用，而文字重组是再简单不过的方式。就像达达主义那样用四处的元素重新拼贴成一幅画。\n【根本没有研究过达达主义，只是按印象来描述】","**内容介绍**\n>正如大标题，整个内容也不过是在歌词里翻找短句重新排序最后变成意识流，假装很文艺这样。\n\n虽然特意增加了意义不明的引言来让内容在不展开的前提下也勉强有可读性。","**制作**\n>代码没一个字是自己写的（感谢ds），我只是一个拿到名为ai的枪的猴子，制作过程中还一度想放弃。\n\n因为讨厌歌单放了一小段就切掉，所以配备音频来强势安利的方法从根源上被否定。而配备专辑封面图的路线尝试过，但没审美最后又摆烂作罢。\n#\n事实上，支撑着没放弃这个项目只是因为已经串好了这些意识流伪叙述故事，而写下了便容易高傲。\n虽然放弃掉更符合本人的精神状态——逃避现实一般躲入梦境。会有「前行」这一环不过是气氛到了，以及D0里碎碎念过的原因。","**尾声**\n>*给自己的毕业礼物，有人看就是送给看到的人的。*\n\n总之，祝毕业快乐。"]},{"title":"其二——我与音乐","paragraphs":[">*虽然无人在意，很久以前被问到爱好的时候根本没想到回答「听歌」。*\n\n彼时当然没想那么多，只是搪塞了一个已经基本不再关注的领域。\n\n有的人会说不喜欢单曲循环，有的是不喜欢翻唱，也有说不喜欢听歌。或许我是在有人说不喜欢听歌的时候意识到我可以说我是喜欢听歌的。","#>虽然大概看不出来，「有人说不喜欢听歌」这件事几乎算得上我自己的文化冲击（，尽管人家的意思可能只是「算不上喜欢的程度」。\n\n最简单、最直接、最真实、最不绕弯子的说法就是，音乐是我的底噪，我需要我所熟悉的旋律来与世界保持距离，因为我对真实的外界没有兴趣，除非找个好理由变成一个观察员——类似某个测试网站里测出的「钟形罩」分型。","#——————省略一些充满前置知识的跑题——————",">总之，即使现在也无法说听歌是爱好，因为这更像是——比如说插着有线耳机时没有选择将耳机线抓住，而是高举播放器来避免线碰到什么——不觉得像输液吗？（乐）\n\n- *巧言令色的说辞罢了。*"]},{"title":"其三——我与高傲","paragraphs":[">不管不顾的剖白也是一种高傲。"]}]}};

    /* =========================================================== constants == */

    // Icon references, so no call site repeats a <path> again.
    var ICON = {
        hand: 'i-hand',
        chevronDown: 'i-chevron-down',
        chevronRight: 'i-chevron-right',
        list: 'i-list',
        arrowUp: 'i-arrow-up',
        caret: 'i-caret',
        book: 'i-book',
        lock: 'i-lock',
        quote: 'i-quote',
        music: 'i-music',
        eyeOff: 'i-eye-off'
    };

    var FOLD_CLASS = 'fold-icon';
    var FOLD_ICON_COLLAPSED = ICON.chevronRight;
    var FOLD_ICON_EXPANDED = ICON.chevronDown;

    var NAV_LABEL_OPEN = '\u6253\u5f00\u76ee\u5f55';
    var NAV_LABEL_CLOSE = '\u5173\u95ed\u76ee\u5f55';
    var SONG_PREFIX = '\u2726 ';

    // Mirrors the original guard against an event firing during setup.
    var BOOTING = true;
    var NAV_SHOW_AFTER = 300;
    var GLOW_MAX_DISTANCE = 100;
    var FOLD_ANIMATION_DELAY = 30;
    var TOGGLE_ALL_DELAY = 50;

    var BQ_OPEN = '<blockquote style="margin:0.3em 0;padding-left:0.8em;border-left:2px solid #64a8ce;color:#cfe2e8;">';
    var UL_OPEN = '<ul style="margin:0.2em 0;padding-left:1.5em;">';
    var HEADING_OPEN = '<div style="font-weight:700;color:#64c59e;margin:0.6em 0 0.2em;font-size:0.92rem;">';
    var RULE = '<hr style="border:none;border-top:1px dashed rgba(100,168,206,0.4);margin:0.6em 0;">';

    var HTML_ESCAPES = {
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;'
    };

    /* ============================================================== helpers == */

    /**
     * Wrap a symbol reference in an SVG element.
     * @param {string} symbol - symbol id from the sprite.
     * @param {string} [style] - inline style attribute value.
     */
    function icon(symbol, style) {
        return '<svg viewBox="0 0 24 24" width="1em" height="1em"' +
            (style ? ' style="' + style + '"' : '') +
            '><use href="#' + symbol + '"/></svg>';
    }

    /** Escape a value for safe insertion into generated HTML. */
    function escapeHtml(s) {
        if (!s) return '';
        return s.replace(/[&<>"'`]/g, function (m) {
            if (m === '&') return '&amp;';
            if (m === "'") return '&#39;';
            if (m === '`') return '&#96;';
            return HTML_ESCAPES[m] || m;
        }).replace(/\n/g, '<br>');
    }

    /**
     * Split a lyric entry into its original/translated halves.
     * @returns {{html: string, isPureChinese: boolean}}
     */
    function buildLyricStructure(text) {
        if (!text) return { html: '', isPureChinese: false };

        if (!text.includes('\n')) {
            return {
                html: '<div class="lyric-translated only-chinese">' + escapeHtml(text) + '</div>',
                isPureChinese: true
            };
        }

        var parts = text.split('\n');
        var original = parts[0].trim();
        var translated = parts.slice(1).join('\n').trim();

        if (translated.length === 0) {
            return {
                html: '<div class="lyric-translated only-chinese">' + escapeHtml(original) + '</div>',
                isPureChinese: true
            };
        }

        return {
            html: '<div class="lyric-original">' + escapeHtml(original) + '</div>' +
                  '<div class="lyric-translated">' + escapeHtml(translated) + '</div>',
            isPureChinese: false
        };
    }

    /** Call fn unless an Enter/Space key event is already being handled. */
    function onActivateKey(fn) {
        return function (event) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                fn(event);
            }
        };
    }

    /* ======================================================= view fragments == */

    function foldIconSvg(symbol) {
        return '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2.5">' +
            '<use href="#' + symbol + '"/></svg>';
    }

    function foldIconSpan(symbol) {
        return '<span class="' + FOLD_CLASS + '">' + foldIconSvg(symbol) + '</span>';
    }

    function introComment(text) {
        var el = document.createElement('div');
        el.className = 'section-intro-comment';
        el.innerHTML = icon(ICON.quote, 'margin-right:8px;opacity:0.7;vertical-align:middle;') + ' ' + escapeHtml(text);
        return el;
    }

    function lyricCard(item) {
        var card = document.createElement('div');
        card.className = 'lyric-card';

        var textEl = document.createElement('div');
        textEl.className = 'lyric-text';
        textEl.innerHTML = buildLyricStructure(item.text).html;
        card.appendChild(textEl);

        if (item.song) {
            var metaEl = document.createElement('div');
            metaEl.className = 'song-meta';
            metaEl.innerHTML = icon(ICON.music) +
                '<span class="song-name">' + SONG_PREFIX + escapeHtml(item.song) + '</span>';
            card.appendChild(metaEl);
        } else {
            textEl.classList.add('narrative');
        }

        return card;
    }

    function sectionTitle(section) {
        var titleEl = document.createElement('div');
        titleEl.className = 'section-title';
        titleEl.setAttribute('tabindex', '0');
        titleEl.setAttribute('role', 'button');
        titleEl.innerHTML = foldIconSpan(FOLD_ICON_COLLAPSED) +
            '<h2>' + escapeHtml(section.title) + '</h2>';
        return titleEl;
    }

    /* ============================================================== timeline == */

    var timelineAxis = null;
    var axisDot = null;

    function recalcAxisGeometry() {
        if (!timelineAxis) return;

        var firstTitle = document.querySelector('.section-title');
        var lastSection = document.querySelector('.section:last-child');
        if (!firstTitle || !lastSection) return;

        var startTop = firstTitle.getBoundingClientRect().top + window.scrollY - 24;
        var endBottom = lastSection.getBoundingClientRect().bottom + window.scrollY + 30;

        timelineAxis.style.top = startTop + 'px';
        timelineAxis.style.height = (endBottom - startTop) + 'px';
    }

    function highlightNearestTitle() {
        if (!timelineAxis || !axisDot) return;

        var titles = Array.from(document.querySelectorAll('.section-title'));
        if (!titles.length) return;

        var dotTop = parseFloat(axisDot.style.top);
        if (isNaN(dotTop)) return;

        var axisRect = timelineAxis.getBoundingClientRect();
        var dotY = axisRect.top + dotTop + axisDot.offsetHeight / 2;
        var nearest = null;
        var minDist = Infinity;

        titles.forEach(function (title) {
            var rect = title.getBoundingClientRect();
            var center = rect.top + rect.height / 2;
            var dist = Math.abs(center - dotY);
            if (dist < minDist) {
                minDist = dist;
                nearest = title;
            }
        });

        titles.forEach(function (title) { title.classList.remove('glow-title'); });
        if (nearest && minDist < GLOW_MAX_DISTANCE) nearest.classList.add('glow-title');
    }

    /** The title or card closest to the middle of the viewport. */
    function getActiveElement() {
        var candidates = Array.from(document.querySelectorAll('.section-title, .lyric-card'));
        if (!candidates.length) return null;

        var viewportCenter = window.scrollY + window.innerHeight / 2;
        var closest = null;
        var minDist = Infinity;

        for (var i = 0; i < candidates.length; i++) {
            var el = candidates[i];
            var rect = el.getBoundingClientRect();
            var center = rect.top + rect.height / 2 + window.scrollY;
            var dist = Math.abs(center - viewportCenter);
            if (dist < minDist) {
                minDist = dist;
                closest = el;
            }
        }

        return closest;
    }

    function refreshTimeline() {
        if (!timelineAxis || !axisDot) return;
        recalcAxisGeometry();

        var axisHeight = timelineAxis.getBoundingClientRect().height;
        var dotHeight = axisDot.offsetHeight;
        var atBottom = (window.innerHeight + window.scrollY + 2) >= document.documentElement.scrollHeight;
        var atTop = window.scrollY <= 2;

        if (atTop) {
            axisDot.style.top = '0px';
            highlightNearestTitle();
            return;
        }

        if (atBottom) {
            axisDot.style.top = Math.max(0, axisHeight - dotHeight) + 'px';
            highlightNearestTitle();
            return;
        }

        var active = getActiveElement();
        if (!active) {
            highlightNearestTitle();
            return;
        }

        var activeRect = active.getBoundingClientRect();
        var activeCenter = activeRect.top + activeRect.height / 2;
        var relativeY = activeCenter - timelineAxis.getBoundingClientRect().top;
        var nextTop = Math.min(Math.max(relativeY - dotHeight / 2, 0), axisHeight - dotHeight);
        if (isNaN(nextTop)) nextTop = 0;
        axisDot.style.top = nextTop + 'px';

        highlightNearestTitle();
    }

    var scrollTicking = false;
    function onScrollOrResize() {
        if (scrollTicking) return;
        scrollTicking = true;
        requestAnimationFrame(function () {
            refreshTimeline();
            scrollTicking = false;
        });
    }

    /* =============================================================== render == */

    function renderSections() {
        var root = document.getElementById('app-root');
        if (!root) return;

        root.innerHTML = '';

        sectionsData.forEach(function (section, secIdx) {
            var sectionEl = document.createElement('div');
            sectionEl.className = 'section';
            sectionEl.appendChild(sectionTitle(section));

            // Lyric cards accumulate here and flush into a .lyric-grid whenever an
            // intro interrupts the run, reproducing the original grouping exactly.
            var pendingCards = [];

            function flushCards() {
                if (!pendingCards.length) return;
                var grid = document.createElement('div');
                grid.className = 'lyric-grid';
                pendingCards.forEach(function (card) { grid.appendChild(card); });
                sectionEl.appendChild(grid);
                pendingCards = [];
            }

            for (var i = 0; i < section.items.length; i++) {
                var item = section.items[i];
                if (item.type === 'intro') {
                    flushCards();
                    sectionEl.appendChild(introComment(item.text));
                } else if (item.type === 'lyric') {
                    pendingCards.push(lyricCard(item));
                }
            }

            flushCards();
            root.appendChild(sectionEl);

            if (secIdx !== sectionsData.length - 1) {
                var separator = document.createElement('div');
                separator.className = 'section-separator';
                root.appendChild(separator);
            }
        });
    }

    function renderPostscript() {

            container.innerHTML = '';

            data.postscript.sections.forEach(function (section) {

                block.className = 'postscript-block';

                title.className = 'postscript-subtitle';
                title.textContent = section.title;
                block.appendChild(title);

                var content = document.createElement('div');
                content.className = 'postscript-content';

                if (section.paragraphs && section.paragraphs.length) {
                    section.paragraphs.forEach(function (paragraph) {
                        var para = document.createElement('div');
                        para.className = 'postscript-paragraph';
                        para.innerHTML = renderMarkdown(paragraph);
                        content.appendChild(para);
                    });
                } else {
                    content.textContent = '';
                }

                block.appendChild(content);
                container.appendChild(block);
            });
        } catch (e) {
            container.innerHTML = '<div class="postscript-block">' +
                '<div class="postscript-content" style="color:#a88;">后记数据加载失败</div></div>';
        }
    }

    /* ============================================================= markdown == */

    /**
     * Minimal markdown renderer for the postscript: emphasis, links, inline code,
     * headings, blockquotes, list items and horizontal rules.
     */
    function renderMarkdown(text) {
        if (!text) return '';

        var out = '';
        var inBlockquote = false;
        var inList = false;

        function inline(s) {
            return s
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
                .replace(/`(.+?)`/g, '<code>$1</code>');
        }

        function closeBlockquote() {
            if (!inBlockquote) return;
            out += '</blockquote>';
            inBlockquote = false;
        }

        function closeList() {
            if (!inList) return;
            out += '</ul>';
            inList = false;
        }

        text.split('\n').forEach(function (rawLine) {
            var line = rawLine.trim();

            if (!line) {
                closeBlockquote();
                closeList();
                out += '<br>';
                return;
            }

            if (/^#/.test(line)) {
                closeBlockquote();
                closeList();
                var heading = line.replace(/^#+/, '').trim();
                out += heading ? HEADING_OPEN + inline(heading) + '</div>' : RULE;
                return;
            }

            if (/^>/.test(line)) {
                closeList();
                if (!inBlockquote) {
                    out += BQ_OPEN;
                    inBlockquote = true;
                }
                out += inline(line.replace(/^> ?/, '')) + '<br>';
                return;
            }

            if (/^- /.test(line)) {
                closeBlockquote();
                if (!inList) {
                    out += UL_OPEN;
                    inList = true;
                }
                out += '<li>' + inline(line.replace(/^- /, '')) + '</li>';
                return;
            }

            closeBlockquote();
            closeList();
            out += inline(line) + '<br>';
        });

        closeBlockquote();
        closeList();

        return out.replace(/<br>$/, '');
    }

    /* ============================================================ behaviours == */

    /**
     * Wrap each lyric grid in a collapsible container and wire the title toggle.
     */
    function setupFoldFeatures() {
        document.querySelectorAll('.section').forEach(function (section) {
            var grid = section.querySelector('.lyric-grid');
            if (!grid) return;
            if (grid.parentElement && grid.parentElement.classList.contains('cards-fold-wrapper')) return;

            var wrapper = document.createElement('div');
            wrapper.className = 'cards-fold-wrapper';
            grid.parentNode.insertBefore(wrapper, grid);
            wrapper.appendChild(grid);

            var titleDiv = section.querySelector('.section-title');
            if (!titleDiv) return;

            var iconSpan = titleDiv.querySelector('.' + FOLD_CLASS);
            if (iconSpan) iconSpan.innerHTML = foldIconSvg(FOLD_ICON_COLLAPSED);

            wrapper.style.display = 'none';
            var expanded = false;

            function toggleFold(event) {
                event.stopPropagation();
                expanded = !expanded;
                wrapper.style.display = expanded ? 'block' : 'none';
                if (iconSpan) {
                    iconSpan.innerHTML = foldIconSvg(expanded ? FOLD_ICON_EXPANDED : FOLD_ICON_COLLAPSED);
                }
                setTimeout(refreshTimeline, FOLD_ANIMATION_DELAY);
                refreshTimeline();
            }

            titleDiv.style.cursor = 'pointer';
            titleDiv.addEventListener('click', toggleFold);
            titleDiv.addEventListener('keydown', onActivateKey(toggleFold));
        });

        refreshTimeline();
    }

    /** The toolbar button that expands or collapses every section at once. */
    function setupToggleAll() {
        var btn = document.getElementById('toggleAllBtn');
        if (!btn) return;

        var allExpanded = false;

        btn.addEventListener('click', function () {
            if (BOOTING) return;

            allExpanded = !allExpanded;

            document.querySelectorAll('.section').forEach(function (section) {
                var wrapper = section.querySelector('.cards-fold-wrapper');
                var titleDiv = section.querySelector('.section-title');
                var iconSpan = titleDiv ? titleDiv.querySelector('.' + FOLD_CLASS) : null;
                if (!wrapper) return;

                wrapper.style.display = allExpanded ? 'block' : 'none';
                if (iconSpan) {
                    iconSpan.innerHTML = foldIconSvg(allExpanded ? FOLD_ICON_EXPANDED : FOLD_ICON_COLLAPSED);
                }
            });

            btn.innerHTML = foldIconSvg(FOLD_ICON_EXPANDED) +
                (allExpanded ? ' 全部收起' : ' 全部展开');

            setTimeout(refreshTimeline, TOGGLE_ALL_DELAY);
        });

        btn.addEventListener('keydown', onActivateKey(function () { btn.click(); }));
    }

    /** The blur mask over the postscript, and the button that restores it. */
    function setupNotesMask() {
        var mask = document.getElementById('notes-mask');
        var wrapper = document.getElementById('postscript-wrapper');
        var reMaskBtn = document.getElementById('reMaskBtn');
        if (!mask || !wrapper) return;

        function reveal() {
            mask.style.display = 'none';
            wrapper.style.filter = 'none';
            wrapper.style.opacity = '1';
            if (reMaskBtn) reMaskBtn.style.display = 'inline-block';
        }

        function conceal() {
            mask.style.display = 'flex';
            wrapper.style.filter = 'blur(4px)';
            wrapper.style.opacity = '0.6';
            if (reMaskBtn) reMaskBtn.style.display = 'none';
        }

        mask.addEventListener('click', reveal);
        mask.addEventListener('keydown', onActivateKey(reveal));

        if (reMaskBtn) {
            reMaskBtn.addEventListener('click', conceal);
            reMaskBtn.addEventListener('keydown', onActivateKey(conceal));
        }
    }

    /** The floating table-of-contents and back-to-top buttons. */
    function setupFloatingNav() {
        var navFloat = document.getElementById('navFloat');
        var navToggle = document.getElementById('navToggle');
        var navPanel = document.getElementById('navPanel');
        var navTop = document.getElementById('navTop');
        if (!navFloat || !navToggle || !navPanel || !navTop) return;

        var navVisible = false;
        var panelOpen = false;

        function setNavLabel(label) {
            navToggle.setAttribute('aria-label', label);
        }

        function closePanel() {
            panelOpen = false;
            navPanel.classList.remove('open');
            setNavLabel(NAV_LABEL_OPEN);
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.addEventListener('scroll', function () {
            var shouldShow = window.scrollY > NAV_SHOW_AFTER;
            if (shouldShow === navVisible) return;
            navVisible = shouldShow;
            navFloat.classList.toggle('visible', navVisible);
        });

        navTop.addEventListener('click', scrollToTop);
        navTop.addEventListener('keydown', onActivateKey(scrollToTop));

        function buildNavPanel() {
            navPanel.innerHTML = '';
            sectionsData.forEach(function (section, idx) {
                var item = document.createElement('button');
                item.className = 'nav-panel-item';
                item.setAttribute('tabindex', '0');
                item.innerHTML = icon(ICON.caret) + ' ' + escapeHtml(section.title);

                item.addEventListener('click', function () {
                    var titles = document.querySelectorAll('.section-title');
                    if (titles[idx]) titles[idx].scrollIntoView({ behavior: 'smooth', block: 'start' });
                    closePanel();
                });
                item.addEventListener('keydown', onActivateKey(function () { item.click(); }));

                navPanel.appendChild(item);
            });
        }

        buildNavPanel();

        navToggle.addEventListener('click', function () {
            if (panelOpen) {
                closePanel();
            } else {
                panelOpen = true;
                navPanel.classList.add('open');
                setNavLabel(NAV_LABEL_CLOSE);
            }
        });
        navToggle.addEventListener('keydown', onActivateKey(function () { navToggle.click(); }));

        document.addEventListener('click', function (event) {
            if (panelOpen && !navFloat.contains(event.target)) closePanel();
        });
    }

    /* ================================================================== boot == */

    function init() {
        renderSections();
        setupFoldFeatures();
        setupToggleAll();

        timelineAxis = document.querySelector('.timeline-axis');
        axisDot = document.querySelector('.axis-dot');
        if (timelineAxis && axisDot) {
            recalcAxisGeometry();
            refreshTimeline();
            window.addEventListener('load', function () {
                recalcAxisGeometry();
                refreshTimeline();
            });
            window.addEventListener('scroll', onScrollOrResize);
            window.addEventListener('resize', function () {
                recalcAxisGeometry();
                onScrollOrResize();
            });
        }

        setupNotesMask();
        setupFloatingNav();
        renderPostscript();

        BOOTING = false;
    }

    init();
})();
</script>
</body>
</html>
